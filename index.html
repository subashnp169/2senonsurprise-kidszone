<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#0d0a1e"/>
  <meta name="description" content="Senna Kids Zone — A magical bilingual learning adventure for toddlers aged 1–4!"/>
  <title>🌟 Senna Kids Zone</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet"/>

  <style>
    /* ═══════════════════════════════════════════════════════
       SENNA KIDS ZONE — GLOBAL DESIGN SYSTEM
       Aesthetic: Cosmic Playground — deep space + candy neon
    ═══════════════════════════════════════════════════════ */
    :root {
      --night:   #0d0a1e;
      --deep:    #160d35;
      --purple:  #3d1a78;
      --violet:  #6c3fc5;
      --pink:    #f43f8e;
      --yellow:  #fde047;
      --cyan:    #22d3ee;
      --green:   #4ade80;
      --orange:  #fb923c;
      --red:     #f87171;
      --white:   #ffffff;
      --muted:   rgba(255,255,255,0.55);
      --font-fun:  'Baloo 2', cursive;
      --font-body: 'Nunito', sans-serif;
    }

    *,*::before,*::after {
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
      user-select:none;
      -webkit-user-select:none;
    }
    html,body {
      margin:0; padding:0;
      width:100%; height:100%;
      overflow:hidden;
      overscroll-behavior:none;
      background:var(--night);
      font-family:var(--font-body);
    }

    /* ── App root ──────────────────────────────────────────── */
    #app {
      width:100%; height:100%;
      position:relative; overflow:hidden;
      background:
        radial-gradient(ellipse at 15% 10%, rgba(108,63,197,.45) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 90%, rgba(244,63,142,.35) 0%, transparent 50%),
        radial-gradient(ellipse at 60% 45%, rgba(34,211,238,.15) 0%, transparent 40%),
        var(--night);
    }

    /* ── View transitions ──────────────────────────────────── */
    .view {
      position:absolute; inset:0;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      transition:opacity .4s ease, transform .4s ease;
    }
    .view.hidden { opacity:0; pointer-events:none; transform:scale(.96) translateY(6px); }

    /* ── Glass card ──────────────────────────────────────────── */
    .glass {
      background:rgba(255,255,255,.08);
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);
      border:1.5px solid rgba(255,255,255,.14);
      border-radius:28px;
    }

    /* ── Big toddler button ──────────────────────────────────── */
    .btn-big {
      border:none; cursor:pointer;
      font-family:var(--font-fun);
      font-size:clamp(1.4rem,4.5vw,2.2rem);
      font-weight:800;
      border-radius:28px;
      padding:clamp(16px,3.5vw,26px) clamp(22px,5vw,44px);
      min-height:clamp(70px,14vw,120px);
      transition:transform .12s cubic-bezier(.34,1.56,.64,1),box-shadow .12s ease;
      display:flex; align-items:center; justify-content:center;
      gap:10px; text-align:center; line-height:1.1;
      position:relative; overflow:hidden;
    }
    .btn-big:active { transform:scale(.87) !important; }
    .btn-big::after {
      content:''; position:absolute; inset:0;
      background:rgba(255,255,255,.18);
      opacity:0; transition:opacity .1s; border-radius:inherit;
    }
    .btn-big:active::after { opacity:1; }

    /* ── Floating bubble answer buttons ──────────────────────── */
    @keyframes bubFloat {
      0%,100% { transform:translateY(0) rotate(-1.5deg); }
      50%      { transform:translateY(-16px) rotate(1.5deg); }
    }
    .bub {
      border:none; cursor:pointer;
      border-radius:50%;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      position:relative; overflow:visible;
      animation:bubFloat var(--fd,3s) ease-in-out infinite;
      animation-delay:var(--fd2,0s);
      transition:transform .12s cubic-bezier(.34,1.56,.64,1);
      flex-shrink:0;
    }
    .bub:active { transform:scale(.82) !important; animation-play-state:paused; }
    /* shine */
    .bub::before {
      content:''; position:absolute;
      top:10%; left:18%;
      width:28%; height:16%;
      background:rgba(255,255,255,.55);
      border-radius:50%; transform:rotate(-30deg);
      pointer-events:none;
    }

    /* ── Particle canvas ─────────────────────────────────────── */
    #particle-canvas {
      position:fixed; inset:0;
      pointer-events:none; z-index:9998;
    }

    /* ── HUD bar ─────────────────────────────────────────────── */
    #hud {
      position:fixed;
      top:env(safe-area-inset-top,0);
      left:0; right:0; z-index:800;
      padding:10px 16px;
      display:flex; justify-content:space-between; align-items:center;
      pointer-events:none;
    }
    .hchip {
      background:rgba(255,255,255,.1);
      border:1.5px solid rgba(255,255,255,.18);
      border-radius:50px;
      padding:6px 14px;
      font-family:var(--font-fun); font-size:.9rem; font-weight:700;
      color:var(--white); pointer-events:all; cursor:pointer;
      transition:background .2s;
    }
    .hchip:active { background:rgba(255,255,255,.22); }

    /* ── Sunset overlay ──────────────────────────────────────── */
    #sunset {
      position:fixed; inset:0; z-index:9980;
      pointer-events:none; opacity:0;
      transition:opacity 10s ease;
      background:linear-gradient(135deg,#f97316,#ec4899,#8b5cf6);
    }
    #sunset.on { opacity:.38; }

    /* ── Sleep screen ────────────────────────────────────────── */
    #sleep {
      position:fixed; inset:0; z-index:9990;
      display:none; flex-direction:column;
      align-items:center; justify-content:center;
      gap:20px; padding:32px; text-align:center;
      background:rgba(13,10,30,.97);
      backdrop-filter:blur(30px);
    }
    #sleep.on { display:flex; }
    @keyframes sleepBob { 0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);} }
    .sleep-icon { animation:sleepBob 2.5s ease-in-out infinite; }

    /* ── Fog wipe canvas wrapper ─────────────────────────────── */
    #fog-wrap {
      position:relative; border-radius:50%; overflow:hidden;
      box-shadow:0 0 60px rgba(34,211,238,.4), 0 0 120px rgba(34,211,238,.2);
    }
    @keyframes ringPulse {
      0%   { transform:scale(1);   opacity:.7; }
      70%  { transform:scale(1.15);opacity:0;  }
      100% { transform:scale(1.15);opacity:0;  }
    }
    .ring {
      position:absolute; border-radius:50%;
      border:3px solid var(--cyan);
      animation:ringPulse 2.2s ease-out infinite;
      pointer-events:none; inset:-6px;
    }
    .ring2 { animation-delay:1.1s; border-color:var(--pink); }

    /* ── Progress strip ──────────────────────────────────────── */
    .prog-track {
      height:10px; background:rgba(255,255,255,.12);
      border-radius:10px; overflow:hidden;
    }
    .prog-fill {
      height:100%; border-radius:10px;
      transition:width .6s cubic-bezier(.4,0,.2,1);
    }

    /* ── Celebration popup ───────────────────────────────────── */
    @keyframes celebPop {
      0%   { transform:scale(0) rotate(-15deg); opacity:1; }
      55%  { transform:scale(1.35) rotate(6deg);  opacity:1; }
      100% { transform:scale(1.1) rotate(0deg);  opacity:0; }
    }
    .celeb {
      position:fixed; pointer-events:none;
      font-family:var(--font-fun); font-weight:800; z-index:9997;
      animation:celebPop 1.5s forwards;
      text-shadow:0 2px 20px rgba(0,0,0,.5);
    }

    /* ── Floating decorations ──────────────────────────────────── */
    @keyframes floatDec {
      0%,100%{transform:translate(0,0) scale(1);}
      40%{transform:translate(10px,-20px) scale(1.08);}
      70%{transform:translate(-8px,8px) scale(.94);}
    }
    .dec { position:absolute; pointer-events:none; animation:floatDec var(--fd,5s) ease-in-out infinite; animation-delay:var(--dd,0s); }

    /* ── Answer shimmer ──────────────────────────────────────── */
    @keyframes shimmer {
      0%   { transform:translateX(-100%) skewX(-15deg); }
      100% { transform:translateX(200%) skewX(-15deg); }
    }
    .shimmer::after {
      content:''; position:absolute; inset:0;
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
      animation:shimmer 2.4s ease-in-out infinite;
      border-radius:inherit;
    }

    /* ── Text utilities ──────────────────────────────────────── */
    .t-hero  { font-size:clamp(2rem,8vw,4rem);    font-family:var(--font-fun); font-weight:800; }
    .t-title { font-size:clamp(1.3rem,5vw,2.2rem); font-family:var(--font-fun); font-weight:700; }
    .t-label { font-size:clamp(.95rem,3.2vw,1.4rem);font-family:var(--font-fun); font-weight:600; }
    .t-emoji { font-size:clamp(3rem,11vw,6.5rem);  line-height:1; }
    .t-mega  { font-size:clamp(4rem,16vw,9rem);    line-height:1; }

    /* ── Loading spinner ─────────────────────────────────────── */
    #splash {
      position:fixed; inset:0; z-index:99999;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:22px;
      background:var(--night);
      transition:opacity .7s ease;
    }
    #splash.out { opacity:0; pointer-events:none; }
    @keyframes spinStar { 0%,100%{transform:scale(1) rotate(0);}50%{transform:scale(1.25) rotate(180deg);} }
    .spin-star { font-size:3.5rem; animation:spinStar 1.6s ease-in-out infinite; }

    /* ── Parent portal specifics ──────────────────────────────── */
    .stat-card {
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.12);
      border-radius:20px; padding:18px;
      display:flex; flex-direction:column; align-items:center; gap:6px;
    }
    .badge-card {
      background:rgba(255,255,255,.07);
      border:1.5px solid rgba(255,255,255,.12);
      border-radius:18px; padding:14px 10px;
      display:flex; flex-direction:column; align-items:center; gap:4px;
      transition:opacity .3s;
    }
    .badge-card.locked { opacity:.28; filter:grayscale(.8); }

    /* ── Input style ──────────────────────────────────────────── */
    .kz-input {
      background:rgba(255,255,255,.1);
      border:2px solid rgba(255,255,255,.2);
      border-radius:18px; padding:14px 20px;
      font-family:var(--font-fun); font-size:1.4rem; font-weight:700;
      color:var(--white); text-align:center; outline:none;
      width:100%; transition:border-color .2s;
    }
    .kz-input::placeholder { color:rgba(255,255,255,.3); }
    .kz-input:focus { border-color:var(--yellow); }

    /* ── Scroll ──────────────────────────────────────────────── */
    .sy { overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .sy::-webkit-scrollbar { width:4px; }
    .sy::-webkit-scrollbar-thumb { background:rgba(255,255,255,.18); border-radius:2px; }

    /* ── Module progress dots ─────────────────────────────────── */
    .dot {
      width:14px; height:14px; border-radius:50%;
      background:rgba(255,255,255,.2);
      transition:background .3s, transform .3s;
    }
    .dot.done  { background:var(--green);  transform:scale(1.1); }
    .dot.active { background:var(--yellow); transform:scale(1.2); box-shadow:0 0 10px var(--yellow); }
  </style>
</head>
<body>
  <!-- Splash -->
  <div id="splash">
    <div class="spin-star">⭐</div>
    <div style="font-family:var(--font-fun);font-size:2rem;font-weight:800;color:var(--yellow);">Senna Kids Zone</div>
    <div style="color:var(--muted);font-size:1rem;">Loading your magical adventure…</div>
  </div>

  <!-- Sunset overlay -->
  <div id="sunset"></div>

  <!-- Sleep screen -->
  <div id="sleep">
    <div class="sleep-icon" style="font-size:5.5rem;">🌙</div>
    <div id="sleep-title" class="t-hero" style="color:var(--yellow);"></div>
    <div id="sleep-desc"  class="t-label" style="color:var(--muted);max-width:320px;line-height:1.65;"></div>
    <div style="font-size:2rem;margin:8px 0;">⭐ ⭐ ⭐</div>
    <button class="btn-big" style="background:var(--violet);color:#fff;font-size:1.1rem;min-height:60px;"
            onclick="window.__SKZ && window.__SKZ.wakeFromSleep()">
      👨‍👩‍👧 Parent Override
    </button>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div id="hud-timer" class="hchip" style="pointer-events:none;">⏰ 18:00</div>
    <div style="display:flex;gap:8px;">
      <div id="lang-btn" class="hchip" onclick="window.__SKZ && window.__SKZ.toggleLang()">🌐 EN</div>
      <div id="parent-btn" class="hchip"
           style="background:rgba(244,63,142,.18);border-color:rgba(244,63,142,.4);"
           onclick="window.__SKZ && window.__SKZ.goParent()">🔒</div>
    </div>
  </div>

  <!-- Particle canvas -->
  <canvas id="particle-canvas"></canvas>

  <!-- App mount -->
  <div id="app"></div>

  <script type="module" src="/src/app.js"></script>
  <script>
    // PWA service worker registration
    if('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(r => console.log('[SKZ] SW registered:', r.scope))
          .catch(e => console.warn('[SKZ] SW failed:', e));
      });
    }
  </script>
  <link rel="manifest" href="/manifest.json"/>
</body>
</html>
